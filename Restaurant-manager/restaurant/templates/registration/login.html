{% load static %}
<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Restaurant POS Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'restaurant/app.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-page) 0%, #e0e5ec 100%);
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid var(--border);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -.5px;
            margin-bottom: 10px;
        }
        .login-logo span {
            color: var(--primary);
        }
        .login-sub {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            background: var(--bg-page);
        }
        .form-control:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-light);
            background: white;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            margin-top: 10px;
        }
        .alert-error {
            background: hsl(0, 75%, 95%);
            color: var(--danger);
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 20px;
            border: 1px solid hsla(0, 75%, 57%, 0.2);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo"><span>Restaurant</span> POS</div>
        <div class="login-sub">Système de gestion intégré</div>

        {% if form.errors %}
            <div class="alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                Identifiant ou mot de passe incorrect.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Nom d'utilisateur</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control" placeholder="Entrez votre identifiant">
            </div>

            <div class="form-group">
                <label for="id_password">Mot de passe</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-login">
                Se connecter <i class="fa-solid fa-arrow-right" style="margin-left:5px"></i>
            </button>
            <input type="hidden" name="next" value="{{ next|default:'/pos/' }}">
        </form>
    </div>

</body>
</html>
